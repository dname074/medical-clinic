spring.application.name=medicalclinic
server.port=8080

# db
spring.datasource.url=jdbc:postgresql://localhost:5432/medical_clinic
spring.datasource.username=user
spring.datasource.password=user
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# liquibase
spring.liquibase.enabled=true
spring.liquibase.changelog=classpath:liquibase/liquibase-changelog.yaml

# keycloak
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/medical-clinic-dev
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/medical-clinic-dev/protocol/openid-connect/certs

sprinddoc.swagger-ui.tagsSorter=alpha