spring.application.name=medicalclinic
server.port=8080

# db
spring.datasource.url=jdbc:postgresql://postgresql:5432/medical-clinic
spring.datasource.username=user
spring.datasource.password=user
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# liquibase
spring.liquibase.enabled=true
spring.liquibase.changelog=classpath:liquibase/liquibase-changelog.yaml

sprinddoc.swagger-ui.tagsSorter=alpha