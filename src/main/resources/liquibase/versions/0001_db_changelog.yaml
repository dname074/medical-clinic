databaseChangeLog:
  - changeSet:
      id: 1
      author: damian
      comment: "Tabela z pacjentami"
      preConditions:
        - onFail: HALT
      changes:
        - createTable:
            tableName: patients
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_patients_id
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_patients_email
              - column:
                  name: password
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: idCardNumber
                  type: varchar(5)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: varchar(9)
              - column:
                  name: birthday
                  type: datetime