databaseChangeLog:
  - changeSet:
      id: 8
      author: damian
      comment: "Table with visits"
      changes:
        - createTable:
            tableName: visits
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_visits_id
              - column:
                  name: start_date
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_visits_patient_id
                    referencedTableName: patients
                    referencedColumnNames: id
              - column:
                  name: doctor_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_visits_doctor_id
                    referencedTableName: doctors
                    referencedColumnNames: id